# Daily: read newly published public DJ sets and update transitions.json (what DJs play next), which Next Up downloads.
# The collector's progress file (state.json) is kept in this repo's Actions cache, never committed: it is private to
# the workflow. Running daily keeps that cache in use (unused caches are cleared after 7 days) and spreads the reading.
# Runs only on its schedule or when started by hand from the Actions tab; pull requests and forks cannot start it.
name: Collect crowd data

on:
  schedule:
    - cron: '0 4 * * *' # every day, 04:00 UTC
  workflow_dispatch:
    inputs:
      max_pages:
        description: Most pages to read (one every 3 seconds)
        default: '250'

permissions:
  contents: write # to commit transitions.json to this repo

concurrency: collect # never two runs at once

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Restore progress
        uses: actions/cache/restore@v4
        with:
          path: private-state
          key: collector-state-${{ github.run_id }}
          restore-keys: collector-state-

      - name: Collect
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || '250' }}
        run: |
          case "$MAX_PAGES" in (''|*[!0-9]*) echo "max_pages must be a number"; exit 1;; esac
          node out/collector/run.js --data . --state private-state/state.json --max-pages "$MAX_PAGES"

      - name: Save progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: private-state
          key: collector-state-${{ github.run_id }}

      - name: Publish
        run: |
          git config user.name "Next Up collector"
          git config user.email "279746717+mazer321-cloud@users.noreply.github.com"
          git rm --cached --ignore-unmatch -q state.json
          git add transitions.json
          git diff --cached --quiet || git commit -m "Data $(date -u +%F)"
          git push
